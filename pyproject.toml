[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "ignition-trace"
version = "0.1.0"
description = "Portable infotainment trace analysis and deterministic event replay"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pydantic>=2.10,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
ignition-trace = "ignition_trace.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ignition_trace"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
